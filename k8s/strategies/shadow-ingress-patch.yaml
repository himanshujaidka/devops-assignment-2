apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.default.svc.cluster.local:80$request_uri"
    nginx.ingress.kubernetes.io/mirror-host: "aceest-shadow.default.svc.cluster.local"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest
                port:
                  number: 80
