apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest
    track: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: blue
  template:
    metadata:
      labels:
        app: aceest
        track: blue
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USER/aceest-fitness:stable
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app: aceest
    track: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: green
  template:
    metadata:
      labels:
        app: aceest
        track: green
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USER/aceest-fitness:candidate
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest
spec:
  selector:
    app: aceest
    track: blue
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
